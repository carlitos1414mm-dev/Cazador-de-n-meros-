<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5DA130">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cazador de Números</title>
<style>
:root{--ink:#1b1b1b;--green:#5DA130;--gold:#E8B923;--red:#C8302B;--blue:#2F4FBF;--cream:#FFF8E7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#87CEEB;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0}
svg{display:block;shape-rendering:crispEdges}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:max(env(safe-area-inset-top),10px) 12px max(env(safe-area-inset-bottom),12px);background:linear-gradient(#BFE6FF,#E9F9D8)}

/* botones tipo bloque */
.btn{--c:var(--green);font:900 clamp(18px,5.2vw,28px)/1 system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--c);border:4px solid var(--ink);padding:12px 16px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;text-shadow:2px 2px 0 rgba(0,0,0,.35);box-shadow:inset -5px -5px 0 rgba(0,0,0,.28),inset 5px 5px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(3px);box-shadow:inset 5px 5px 0 rgba(0,0,0,.28),inset -5px -5px 0 rgba(255,255,255,.2)}
.btn.green{--c:#5DA130}.btn.gold{--c:#d19a10}.btn.red{--c:#C8302B}.btn.blue{--c:#2F4FBF}.btn.gray{--c:#6f6f6f}
.btn.big{min-height:84px}
.btn svg{width:44px;height:36px}
.sq{width:60px;min-width:60px;height:60px;min-height:0;padding:0;font-size:28px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--cream);border:4px solid var(--ink);padding:6px 14px;font-weight:900;font-size:26px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.15)}
.chip svg{width:28px;height:28px}

/* menú */
.sky{position:relative;flex:1;min-height:0;border:4px solid var(--ink);background:linear-gradient(#6EC1F0,#BFE6FF);overflow:hidden}
.sky .title{position:absolute;left:0;right:0;top:14px;text-align:center;font:900 clamp(26px,8vw,40px)/1.05 system-ui,sans-serif;text-transform:uppercase;color:#fff;letter-spacing:1px;text-shadow:3px 3px 0 #2F4FBF,-2px -2px 0 #2F4FBF,3px -2px 0 #2F4FBF,-2px 3px 0 #2F4FBF;z-index:1}
.sky .scene{position:absolute;inset:0}
.sky .scene svg{width:100%;height:100%}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.tile{background:var(--cream);border:3px solid var(--ink);padding:3px}
.tile svg{width:100%;height:auto}
.menubtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* contar */
.grid{flex:none;width:min(100%,58vh);align-self:center;aspect-ratio:1;margin:auto 0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px}
.cell{position:relative;background:rgba(255,255,255,.6);border:4px solid var(--ink);padding:12px;display:flex;align-items:center;justify-content:center;min-height:0}
.cell.empty{visibility:hidden}
.cell .spr{display:block;width:100%;height:100%}
.cell .spr svg{width:100%;height:100%}
.cell .tick{position:absolute;right:4px;top:-2px;font-size:34px;display:none;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3))}
.cell.on{background:#c8f5a8}.cell.on .spr{opacity:.8;transform:scale(.88)}.cell.on .tick{display:block}
.cell.hl{outline:7px solid #FFE066;outline-offset:-3px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.answer{min-height:112px;display:flex;align-items:center;justify-content:center;gap:12px;position:relative}
.hint{font-size:56px;animation:bounce 1s ease infinite}
.mic{width:110px;height:100px;font-size:52px;animation:pulse 1.2s ease infinite}
.mic.listening{--c:#e8521e;animation:pulse .5s ease infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.numpad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;width:100%}
.numpad .btn{min-height:56px;padding:6px 0;font-size:24px}
.parentok{position:absolute;left:0;bottom:0;width:44px;height:44px;border:3px solid rgba(0,0,0,.25);background:rgba(255,255,255,.35);color:rgba(0,0,0,.35);font-size:22px;font-weight:900}
.holding{background:rgba(93,161,48,.6)!important}

/* revelar */
.reveal{align-items:center;text-align:center}
.reveal .hud{width:100%}
.bigwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
.bigwrap svg{height:100%;max-height:48vh;width:auto;max-width:80vw;animation:bounce 1.1s ease infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.18))}
.qty{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:320px}
.qty svg{width:30px;height:30px}
.reveal #go,.found #again{width:100%}

/* escondidas */
.hunt{padding:0;background:#000}
.hunt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
.hunt .frame{position:absolute;left:50%;top:52%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);border:6px dashed rgba(255,255,255,.85);pointer-events:none}
.hunt .overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:max(env(safe-area-inset-top),10px) 12px 16px;pointer-events:none}
.hunt .overlay>*{pointer-events:auto}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.targetbox{display:flex;align-items:center;gap:12px;background:var(--cream);border:4px solid var(--ink);padding:8px 14px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.15)}
.targetbox svg{height:84px;width:auto}
.targetbox .spk{font-size:34px}
.hunt .parentok{position:static}
.msg{align-self:center;background:var(--cream);border:4px solid var(--ink);padding:12px 18px;font-weight:900;font-size:26px;text-align:center;max-width:92%}
.msg.bad{background:#ffd6d2}

/* encontrado */
.found{align-items:center;text-align:center;overflow:hidden}
.found .bigwrap svg{max-height:34vh}
.gain{display:flex;align-items:center;gap:10px;font-size:54px;font-weight:900;text-shadow:3px 3px 0 rgba(0,0,0,.2)}
.gain svg{width:56px;height:56px}
.cf{position:absolute;top:-40px;border:2px solid rgba(0,0,0,.35);animation:fall 1.9s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(420deg)}}
.row{display:flex;gap:10px;width:100%}.row .btn{flex:1}

/* tienda */
.mini{position:relative;height:30vh;min-height:150px;border:4px solid var(--ink);background:linear-gradient(#6EC1F0,#BFE6FF);overflow:hidden;flex:none}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.tabs{display:flex;gap:6px;flex:none}
.tab{flex:1;height:60px;background:var(--cream);border:4px solid var(--ink);padding:4px}
.tab.on{background:var(--gold)}
.tab svg{width:100%;height:100%}
.items{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start;padding-bottom:8px}
.item{position:relative;background:var(--cream);border:4px solid var(--ink);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.item .ico{height:92px;width:100%;display:flex;align-items:center;justify-content:center}
.item .ico svg{height:100%;width:auto;max-width:100%}
.item .nm{font-weight:800;font-size:15px}
.item.cant{opacity:.7}
.item.owned{background:#c8f5a8}
.item.eq{outline:6px solid var(--gold);outline-offset:-3px}
.price{display:flex;align-items:center;gap:6px;font-weight:900;font-size:24px}
.price svg{width:24px;height:24px}
.badge{position:absolute;top:2px;right:6px;font-size:26px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.panel{background:var(--cream);border:5px solid var(--ink);padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:360px}
.panel .ico{height:140px}.panel .ico svg{height:100%;width:auto}

/* padres */
.parent{overflow:auto;padding-bottom:30px}
.pcard{background:var(--cream);border:4px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px;flex:none}
.pcard h3{margin:0;font-size:18px}
.pcard .btn{font-size:16px;min-height:46px;padding:8px}
.pcard small{opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .btn{flex:1;min-width:44px}
.btn.sel{--c:#d19a10}

.toastf{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);z-index:20;background:var(--cream);border:4px solid var(--ink);padding:10px 18px;font-weight:900;font-size:24px;text-align:center;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   CAZADOR DE NÚMEROS · juego de escondidas con tarjetas QR
   ========================================================= */

// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = n => Math.floor(Math.random() * n);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash(x, y, s) { let h = Math.imul(x + 1, 374761393) + Math.imul(y + 1, 668265263) + Math.imul(s + 1, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) % 1000 / 1000; }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; const t = f < 0 ? 0 : 255, k = Math.abs(f); r = Math.round(r + (t - r) * k); g = Math.round(g + (t - g) * k); b = Math.round(b + (t - b) * k); return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1); }
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };

// ---------- pixel art: celdas -> SVG ----------
const svgOf = (w, h, cells, par = 'xMidYMid meet') => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="${par}" shape-rendering="crispEdges">${cells.map(c => `<rect x="${c[0]}" y="${c[1]}" width="${c[2]}" height="${c[3]}" fill="${c[4]}"/>`).join('')}</svg>`;
function fnCells(w, h, fn, ox = 0, oy = 0, out = []) {
  for (let y = 0; y < h; y++) { let x = 0; while (x < w) { const c = fn(x, y); let e = x + 1; while (e < w && fn(e, y) === c) e++; if (c) out.push([ox + x, oy + y, e - x, 1, c]); x = e; } }
  return out;
}
function mapCells(map, pal, ox = 0, oy = 0, out = []) {
  map.forEach((row, y) => { let x = 0; while (x < row.length) { const ch = row[x]; let e = x + 1; while (e < row.length && row[e] === ch) e++; if (pal[ch]) out.push([ox + x, oy + y, e - x, 1, pal[ch]]); x = e; } });
  return out;
}

// ---------- fuente de números (5x7) y colores tipo materiales ----------
const FONT = {
  1: ["..#..", ".##..", "..#..", "..#..", "..#..", "..#..", ".###."],
  2: [".###.", "#...#", "....#", "...#.", "..#..", ".#...", "#####"],
  3: [".###.", "#...#", "....#", "..##.", "....#", "#...#", ".###."],
  4: ["...#.", "..##.", ".#.#.", "#..#.", "#####", "...#.", "...#."],
  5: ["#####", "#....", "####.", "....#", "....#", "#...#", ".###."],
  6: ["..##.", ".#...", "#....", "####.", "#...#", "#...#", ".###."],
  7: ["#####", "....#", "...#.", "..#..", ".#...", ".#...", ".#..."],
  8: [".###.", "#...#", "#...#", ".###.", "#...#", "#...#", ".###."],
  9: [".###.", "#...#", "#...#", ".####", "....#", "...#.", ".##.."],
};
const COLORS = {
  1: ['#5DA130', '#8BD14E', '#3B6B1C'], 2: ['#8B5A2B', '#B8814A', '#5A3A1B'], 3: ['#8A8A8A', '#B5B5B5', '#5A5A5A'],
  4: ['#E8B923', '#FFE066', '#A07E0A'], 5: ['#2BC4C4', '#7FEFEF', '#178080'], 6: ['#C8302B', '#F06A64', '#821B18'],
  7: ['#2F4FBF', '#6E8CF0', '#1A2E7A'], 8: ['#8A3FC4', '#B97FF0', '#55257E'], 9: ['#E8761E', '#FFA85C', '#A04D0C'],
};
const GRAY = ['#9aa5ad', '#b8c2c9', '#7b868e'];
function numeralSVG(n, gray) {
  const col = gray ? GRAY : COLORS[n], s = 7, out = [];
  FONT[n].forEach((row, r) => { for (let k = 0; k < 5; k++) if (row[k] === '#') { const x = k * s, y = r * s; out.push([x, y, s, s, col[0]], [x, y, s, 1, col[1]], [x, y, 1, s, col[1]], [x, y + s - 1, s, 1, col[2]], [x + s - 1, y, 1, s, col[2]]); } });
  return svgOf(35, 49, out);
}

// ---------- bloques, cofres, camas, lobo, moneda ----------
const BLOCKS = {
  grass: (x, y) => y < 2 ? (hash(x, y, 1) < .3 ? '#8BD14E' : '#5DA130') : (hash(x, y, 2) < .25 ? '#6b431f' : '#8B5A2B'),
  dirt: (x, y) => hash(x, y, 3) < .25 ? '#6b431f' : (hash(x, y, 4) < .15 ? '#a8743d' : '#8B5A2B'),
  stone: (x, y) => hash(x, y, 5) < .3 ? '#6f6f6f' : (hash(x, y, 6) < .2 ? '#a5a5a5' : '#8a8a8a'),
  gold: (x, y) => ((x + y) % 4 === 0 && hash(x, y, 7) < .7) ? '#FFE066' : (hash(x, y, 8) < .2 ? '#b8860b' : '#E8B923'),
  diamond: (x, y) => hash(x, y, 9) < .28 ? '#7FEFEF' : (hash(x, y, 10) < .2 ? '#178080' : '#2BC4C4'),
};
function blockCells(type) {
  const f = BLOCKS[type];
  return fnCells(8, 8, (x, y) => { let c = f(x, y); if (x === 7 || y === 7) c = shade(c, -.28); else if (x === 0 || y === 0) c = shade(c, .22); return c; });
}
const blockSVG = t => svgOf(8, 8, blockCells(t));

const CHEST = [".DDDDDDDD.", "DWWWWWWWWD", "DWwwwwwwWD", "DDDDLLDDDD", "DWWWLLWWWD", "DWWWWWWWWD", "DWWWWWWWWD", "DDDDDDDDDD"];
const CHESTPAL = {
  wood: { W: '#A0692F', w: '#C48A4A', D: '#5A3A1B', L: '#E8B923' },
  iron: { W: '#BDBDBD', w: '#E0E0E0', D: '#5a5a5a', L: '#E8B923' },
  gold: { W: '#E8B923', w: '#FFE066', D: '#8a6a08', L: '#ffffff' },
  diamond: { W: '#2BC4C4', w: '#7FEFEF', D: '#137070', L: '#ffffff' },
};
const BED = ["HH..........", "HHPPBBBBBBBB", "HHPPBBBBBBBB", "HHHHHHHHHHHH", "HH........HH", "HH........HH"];
const BEDCOL = { red: '#C8302B', blue: '#2F4FBF', green: '#5DA130', purple: '#8A3FC4' };
const bedPal = c => ({ H: '#4a2d12', P: '#F2F2F2', B: BEDCOL[c] });
const WOLF = ["dd......dd", "dgg....ggd", ".gggggggg.", ".gkggggkg.", ".gggwwggg.", "..gwkkwg..", "..rrrrrr..", ".gggggggg.", ".gggwwggg.", ".ww....ww."];
const WOLFPAL = { g: '#BDBDBD', d: '#7d7d7d', k: '#1b1b1b', w: '#F2F2F2', r: '#C8302B' };
const COIN = ["..dddd..", ".dYYYYd.", "dYYwwYYd", "dYwYYYYd", "dYwYYYYd", "dYYYYYYd", ".dYYYYd.", "..dddd.."];
const COINPAL = { d: '#A07E0A', Y: '#E8B923', w: '#FFE066' };
const coinSVG = () => svgOf(8, 8, mapCells(COIN, COINPAL));
const CLOUD = ["...WWW...", ".WWWWWWW.", "WWWWWWWWW"];
const chestSVG = t => svgOf(10, 8, mapCells(CHEST, CHESTPAL[t || 'wood']));
const bedSVG = c => svgOf(12, 6, mapCells(BED, bedPal(c || 'red')));
function itemSVG(type) { return type === 'chest' ? chestSVG('wood') : type === 'bed' ? bedSVG('red') : blockSVG(type); }
const ITEM_TYPES = ['grass', 'dirt', 'stone', 'gold', 'diamond', 'chest', 'bed'];

// ---------- personaje y espadas ----------
const CHAR = [
  "...HHHHHH...", "...HHHHHH...", "...HSSSSH...", "...SESSES...", "...SSSSSS...", "...SSMMSS...",
  ".BBBBBBBBBB.", ".BBBBBBBBBB.", ".BBBBBBBBBB.", ".SSBBBBBBSS.", ".SSBBBBBBSS.", "...BBBBBB...", "...BBBBBB...",
  "...PPQQPP...", "...PPQQPP...", "...PPQQPP...", "...PPQQPP...", "...PPQQPP...", "...KKKKKK...",
];
const ARMOR = {
  leather: { H: '#8B5A2B', B: '#A0692F', P: '#7a4a22', Q: '#5a3a1b', K: '#5a3a1b' },
  iron: { H: '#C0C0C0', B: '#D0D0D0', P: '#A8A8A8', Q: '#7a7a7a', K: '#7a7a7a' },
  gold: { H: '#FFE066', B: '#E8B923', P: '#C99a14', Q: '#A07E0A', K: '#A07E0A' },
  diamond: { H: '#7FEFEF', B: '#2BC4C4', P: '#1fa0a0', Q: '#178080', K: '#178080' },
};
const SWORD = { wood: ['#A0692F', '#C48A4A'], stone: ['#8a8a8a', '#b5b5b5'], iron: ['#D0D0D0', '#F2F2F2'], gold: ['#E8B923', '#FFE066'], diamond: ['#2BC4C4', '#7FEFEF'] };
function swordCells(type, ox = 0, oy = 0, out = []) {
  const [b, l] = SWORD[type];
  out.push([ox + 1, oy, 1, 7, l], [ox + 2, oy, 1, 7, b], [ox, oy + 7, 4, 1, '#5A3A1B'], [ox + 1, oy + 8, 2, 2, '#8B5A2B'], [ox + 1, oy + 10, 2, 1, '#E8B923']);
  return out;
}
function charCells(armor, sword, ox = 0, oy = 0, out = []) {
  const base = { H: '#5a3a1b', S: '#F2C79B', E: '#1b1b1b', M: '#b5654a', B: '#3B7DD8', P: '#3A3A8C', Q: '#27275e', K: '#4a4a4a' };
  mapCells(CHAR, Object.assign({}, base, ARMOR[armor] || {}), ox, oy, out);
  if (sword) swordCells(sword, ox + 11, oy + 2, out);
  return out;
}
const charSVG = (armor, sword) => svgOf(15, 19, charCells(armor, sword));

// ---------- paredes de la casa ----------
const WALLS = {
  wood: (x, y) => { if (y % 4 === 3) return '#5A3A1B'; if ((x + (y >> 2) * 3) % 11 === 0) return '#6e4522'; return hash(x, y, 11) < .15 ? '#b57a3a' : '#A0692F'; },
  stone: (x, y) => { const r = hash(x >> 1, y >> 1, 12); return r < .25 ? '#6f6f6f' : r < .55 ? '#8a8a8a' : r < .85 ? '#9a9a9a' : '#b0b0b0'; },
  brick: (x, y) => { if (y % 4 === 3 || (x + ((y >> 2) % 2) * 4) % 8 === 7) return '#d8cbb5'; return hash(x, y, 13) < .2 ? '#8f2f24' : '#A33B2E'; },
  obsidian: (x, y) => hash(x, y, 14) < .18 ? '#4b2a8a' : hash(x, y, 15) < .4 ? '#2a1650' : '#1c1030',
  gold: (x, y) => (x % 6 === 5 || y % 6 === 5) ? '#b8860b' : hash(x, y, 16) < .2 ? '#FFE066' : '#E8B923',
  diamond: (x, y) => (x % 6 === 5 || y % 6 === 5) ? '#178080' : hash(x, y, 17) < .25 ? '#7FEFEF' : '#2BC4C4',
};

// ---------- escena: casa + personaje + cosas compradas ----------
function sceneCells(st) {
  const c = [];
  const e = st.equip;
  mapCells(CLOUD, { W: '#ffffff' }, 5, 6, c);
  mapCells(CLOUD, { W: '#ffffff' }, 41, 3, c);
  c.push([54, 9, 6, 6, '#FFE066'], [55, 10, 4, 4, '#FFF3A0']);
  // pasto y tierra (se extienden más allá de los bordes para pantallas anchas)
  const GX = -80;
  fnCells(224, 26, (x, y) => {
    if (y === 0) return hash(x, y, 20) < .3 ? '#a3e063' : '#8BD14E';
    if (y < 20) return hash(x, y, 21) < .12 ? '#4a8a24' : hash(x, y, 24) < .1 ? '#8BD14E' : '#5DA130';
    return hash(x, y, 22) < .25 ? '#6b431f' : (hash(x, y, 23) < .12 ? '#a8743d' : '#8B5A2B');
  }, GX, 38, c);
  // caminito de la puerta

const NUMMAP = { cero: 0, un: 1, uno: 1, una: 1, dos: 2, tres: 3, tes: 3, cuatro: 4, cuato: 4, cinco: 5, sinco: 5, seis: 6, sies: 6, siete: 7, ocho: 8, nueve: 9, nuebe: 9 };

  const items = cat.items.map(([id, nm, price]) => {
    const own = isOwned(TAB, id), eq = own && isEq(TAB, id), cant = !own && S.coins < price;
    return `<button class="item ${own ? 'owned' : ''} ${eq ? 'eq' : ''} ${cant ? 'cant' : ''}" data-id="${id}">
      ${own ? '<span class="badge">' + (eq ? '⭐' : '✓') + '</span>' : ''}
      <div class="ico">${itemIcon(TAB, id)}</div><div class="nm">${nm}</div>
      ${own ? '' : `<div class="price">${coinSVG()}${price}</div>`}</button>`;
  }).join('');
  app.innerHTML = `<div class="screen shop">
    <div class="hud"><button class="btn gray sq" id="home">⌂</button>${coinChip()}<span style="width:60px"></span></div>
    <div class="mini">${sceneSVG()}</div>
    <div class="tabs">${tabs}</div>
    <div class="items">${items}</div>
  </div>`;
  $('#home').onclick = () => go('menu');
  $$('.tab').forEach(t => t.onclick = () => { unlockAudio(); sfx.pop(450); TAB = t.dataset.t; shop(); });
  $$('.item').forEach(b => b.onclick = () => { unlockAudio(); tapItem(b.dataset.id); });
}
function tapItem(id) {
  const it = CAT.find(c => c.cat === TAB).items.find(i => i[0] === id), price = it[2];
  if (isOwned(TAB, id)) {
    if (TAB === 'pet') { sfx.coin(); speak('¡Guau!'); return; }
    S.equip[TAB] = id; save(); sfx.pop(600); shop(); return;
  }
  if (S.coins < price) { sfx.bad(); vib(80); const need = price - S.coins; toast(`Te faltan ${need} 🪙`); speak(`Te faltan ${numWord(need)} monedas`); return; }
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="panel"><div class="ico">${itemIcon(TAB, id)}</div><div class="price">${coinSVG()}${price}</div><div class="row"><button class="btn red" id="no">✕</button><button class="btn green" id="yes">✓</button></div></div>`;
  $('.screen').appendChild(m);
  $('#no').onclick = () => m.remove();
  $('#yes').onclick = () => {
    S.coins -= price;
    if (TAB === 'pet') S.wolf = true; else { S.owned[TAB + ':' + id] = true; S.equip[TAB] = id; }
    save(); sfx.buy(); vib([50, 30, 50]); shop(); confetti($('.screen'), 24);
    speak(TAB === 'pet' ? '¡Tienes un lobito! ¡Guau!' : '¡Lo compraste!');
  };
}

// ---- PADRES ----
function parent() {
  const sel = (a, b) => a === b ? 'sel' : '';
  const found = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `${n}: <b>${S.found[n] || 0}</b>`).join(' · ');
  const bd = ('BarcodeDetector' in window) ? 'sí' : 'no', js = window.jsQR ? 'sí' : 'no (pon jsQR.js junto al juego si BarcodeDetector = no)';
  app.innerHTML = `<div class="screen parent">
    <div class="hud"><button class="btn gray sq" id="home">⌂</button><b style="font-size:22px">Padres</b><span style="width:60px"></span></div>
    <div class="pcard"><h3>Números que salen (hasta el…)</h3>
      <div class="chips"><button class="btn gray ${sel(S.max, 0)}" data-max="0">Auto</button>${[2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="btn gray ${sel(S.max, n)}" data-max="${n}">${n}</button>`).join('')}</div>
      <small>Ahora salen del 1 al ${maxNum()}. En Auto sube 1 número cada 4 tarjetas encontradas.</small></div>
    <div class="pcard"><h3>Voz de la app</h3><button class="btn gray ${S.voice ? 'sel' : ''}" id="tvoice">${S.voice ? 'Encendida' : 'Apagada'}</button></div>
    <div class="pcard"><h3>Contestar con micrófono</h3><button class="btn gray ${S.mic ? 'sel' : ''}" id="tmic">${S.mic ? 'Micrófono' : 'Botones con números'}</button><small>Reconocimiento de voz del navegador: ${SR ? 'disponible' : 'no disponible (se usan botones)'}</small></div>
    <div class="pcard"><h3>Monedas: ${S.coins}</h3><div class="chips"><button class="btn gray" data-c="-10">−10</button><button class="btn gray" data-c="10">+10</button><button class="btn gray" data-c="50">+50</button></div></div>
    <div class="pcard"><h3>Lector de QR</h3><small>BarcodeDetector: ${bd}<br>jsQR.js: ${js}</small></div>
    <div class="pcard"><h3>Veces que encontró cada número</h3><div>${found}</div></div>
    <div class="pcard"><button class="btn red" id="reset">Borrar todo (mantén 2 s)</button></div>
  </div>`;
  $('#home').onclick = () => go('menu');
  $$('[data-max]').forEach(b => b.onclick = () => { S.max = +b.dataset.max; save(); parent(); });
  $$('[data-c]').forEach(b => b.onclick = () => { S.coins = Math.max(0, S.coins + (+b.dataset.c)); save(); parent(); });
  $('#tvoice').onclick = () => { S.voice = !S.voice; save(); parent(); };
  $('#tmic').onclick = () => { S.mic = !S.mic; save(); parent(); };
  onHold($('#reset'), 2000, () => { S = defaults(); save(); go('menu'); });
}

const SCREENS = { menu, count, reveal, hunt, found, shop, parent };

// ---------- arranque ----------
function boot() {
  app = document.getElementById('app'); S = load();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); else if (CUR === 'hunt' && H && !H.done) go('hunt', { n: H.n }); });
  try { hasTTS() && speechSynthesis.getVoices(); } catch (e) { }
  go('menu');
}
if (typeof document !== 'undefined' && document.getElementById('app')) boot();
</script>
</body>
</html>
